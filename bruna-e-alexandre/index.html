<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Um presente para Bruna e Alexandre</title>
<meta name="description" content="De Ari, Giu, Natanzinho e Marcelo. É para os dois abrirem juntos.">
<meta name="theme-color" content="#FBFAF7">
<meta name="robots" content="noindex">

<!-- Prévia em WhatsApp e afins. A imagem é composta por tools/gerar-og.py:
     a ilustração da capa é preta sobre transparente, e transparência vira
     preto no WhatsApp. A prévia não revela o presente. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://marcelojrfarias.github.io/unwrapagift/bruna-e-alexandre/">
<meta property="og:title" content="Bruna e Alexandre, um presente para desembrulhar juntos">
<meta property="og:description" content="De Ari, Giu, Natanzinho e Marcelo. É para os dois abrirem juntos.">
<meta property="og:image" content="https://marcelojrfarias.github.io/unwrapagift/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Bruna e Alexandre, em traço, de mãos dadas">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap">

<link rel="stylesheet" href="../assets/theme-botanico.css">
<link rel="stylesheet" href="../assets/base.css">
</head>
<body>

<div class="chrome">
  <nav class="progress" id="progress" aria-label="Etapas do presente"></nav>
</div>

<button class="back" id="back" type="button" aria-label="Voltar uma etapa">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
       stroke="currentColor" stroke-width="1" aria-hidden="true">
    <path d="M11 3.5 5.5 9l5.5 5.5"/>
  </svg>
</button>

<main class="stage">
  <div class="card" id="card"></div>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="waves" id="waves" aria-hidden="true" hidden></div>
<div class="waves__status" id="wavesStatus" aria-hidden="true">
  <div class="waves__sprig" id="wavesSprig"></div>
  <p class="waves__note" id="wavesNote"></p>
</div>
<p class="sr-only" id="announcer" aria-live="polite"></p>

<script src="../gifts/bruna-alexandre.js"></script>
<script src="../assets/hold.js"></script>
<script src="../assets/engine.js"></script>
</body>
</html>
